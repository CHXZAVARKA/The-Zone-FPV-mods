; player_list 1.0 - settings.
; Change a value, save, restart the game - or change it in Pause > Mods with
; mod_settings (turning the mod on or off takes a restart; the rest changes
; at once). Delete a line to use the default. Updates keep what you change
; here (settings.default.cfg has the defaults). player_list/status.txt shows
; what was applied.

[mod]

; false = turn player_list off: the game runs as if it were not installed.
enabled=true

[player_list]

; The game's list of the other players, top left - their names, with the
; buttons to watch them in a small window or full screen:
;   "flyout" - out of the way until you move the mouse to the left edge of
;              the screen: then it slides out, on a dark panel, and goes
;              back once the mouse moves off it (or the game hides the
;              pointer)
;   "hidden" - never shown
;   "shown"  - as the game shows it
player_list="flyout"

; Say in the chat when a player joins or leaves the lobby, and who is already
; there when you arrive - or how many, with more than three. The game lets a
; player go 5 seconds after it last hears from them, so "left" comes that
; long after they go; someone who drops and comes back within two minutes
; "rejoined".
join_leave_messages=true
