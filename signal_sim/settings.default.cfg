; signal_sim 1.1 - settings.
; Change a value, save, restart the game - or change it in Pause > Mods (F9
; while flying) with mod_settings: it changes at once. Delete a line to use
; the default. Updates keep what you change here (settings.default.cfg has
; the defaults). signal_sim/status.txt shows what was applied.

[mod]

; false = turn signal_sim off: the game runs as if it were not installed.
enabled=true

[signal]

; For every Signal Simulation mode: the game's digital and analog ones, and
; any of your own in signal_sim/modes. Leave both as they are for the game's
; own signal.

; The weakest the signal gets, 0 to 100. With 60, the picture never gets worse
; than it is at 60 quality, so you can fly far behind walls and keep a picture,
; with some breakup. 0 = no floor (the game's own).
minimum=0

; How much walls and range cost, in percent, 0 to 200. 50 = half the loss at
; the same spot (the picture holds up about twice as far), 200 = twice the
; loss. 100 = the game's own.
intensity=100

; "Analog 400mw by Nito": analog400mw's breakup, drawn on top of the game's
; own analog modes (Analog 2500 and Analog whoop - pick one in Pause > Game
; Settings > Signal Simulation): colour bands with white sparkle, white
; specks and streaks with range, white snow at the end, colour hits close in.
; It goes over the OSD too, as the game's analog does.
[analog_400mw]

; false = the game's analog modes as the game has them.
on=true

; How much breakup, 0 to 2: 1 = as tuned to 400 mW whoop DVR footage, 0 =
; none (the settings below still apply), 2 = twice as often.
strength=1.0

; How much of the game's own link noise is kept, 0 to 1: its colourful
; speckle, torn lines and rolling. The breakup above is mostly white, as DVR
; footage is. 1 = the game's own.
game_noise=0.3

; The camera's colour cast, 0 to 1: 0 = neutral, 1 = the game's own (its
; whoop camera is green-yellow in the middle and blue at the edges).
lens_tint=0.0

; How far the video reaches in the open, in metres, 0 to 2000: noise comes in
; at about a quarter of this and the picture is gone here; walls cut it much
; shorter, as in the game. 0 = no loss in the open, only behind walls (the
; game's own way).
open_range=400
