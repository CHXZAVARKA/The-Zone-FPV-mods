; dirty_air 1.3 - settings.
; Change a value, save, restart the game. Delete a line to use the default.
; Updates keep what you change here (settings.default.cfg has the defaults).
; dirty_air/status.txt shows the drone in use and where its prop wash starts.

[mod]

; false = turn dirty_air off: the game runs as if it were not installed.
enabled=true

[dirty_air]

; Falling into the air the props have pushed down: a little more thrust
; falling slowly, then - from about half to 1.7 times the props' hover wake
; speed, worst at 1.1 - a loss of about 30% and a fluctuating, uneven thrust
; that bobs and rocks the quad. 1 = as measured on small props; 0 = none (the game gives
; the same thrust falling as hovering).
descent=1.0

; The air the quad leaves behind: hovering, punching or turning, the props
; leave a column of air going the other way, which spreads and slows over a
; second or two (less of it the faster you fly). Flying back into it -
; diving down after a punch, turning back through where you hovered - its
; flow and gusts change each prop's thrust: the quad loses lift, bobs, and
; with the flight_controller mod on, shakes. 1 = as worked out; 0 = none.
; For every drone, times each drone's own wake (Pause > Mods > drones, or
; drones/settings.cfg).
wake=1.0

; How much each prop's thrust comes and goes in dirty air - in its own ring
; wake and in the gusts of the air left behind - without changing how much
; lift is lost on average. 1 = as measured on small props at fixed rpm
; (about 17% at the worst of the ring state, for props in ducts; 30% for
; props in the open); measurements on bigger rotors go to two or three
; times that. It is what the flight_controller mod
; shakes against: raise it for more prop wash. 0 = steady thrust. For every
; drone, times each drone's own wash (Pause > Mods > drones, or
; drones/settings.cfg) - set one drone's there.
wash=1.0

; An added prop-wash shake in that wake: a small, fast attitude jitter
; (about 25 times a second, 1.5 degrees at the worst of it at 1), sized by
; feel. Off by default: with the flight_controller mod on, the real thing
; comes from the flight controller fighting the uneven thrust, and without
; it the jitter looks more like a glitch than air. 0 = none.
shake=0.0

; More thrust with the floor under the props (up to 20%, within five prop
; radii) - and a push to level when one side is lower. 0 = none.
ground_effect=1.0

; The props pulled up towards a ceiling (up to 60%, within two prop
; radii). 0 = none.
ceiling_effect=1.0

;; ---- Other pilots ----

; true = other players' quads leave their air behind too, worked out from
; what the game receives for them (where they are, their attitude, their
; throttle, how they move): fly behind or under someone and their air takes
; your lift and shakes you, as your own does. The nearest 3 within 40 m.
; false = only your own.
others_wake=false

;; ---- Wind ----

; The game's own wind, km/h, 0 to 50: the same as /set wind_speed in its
; chat. Change it here and the game's wind changes; set it in the chat and
; it shows here. 0 = no wind. Like /set wind_speed, it lasts until the game
; closes: the game starts with no wind, and this goes back to 0 with it.
wind_kph=0

; true = the wind gusts and swirls: random gusts along, across and up and
; down the wind, which push the quad about and bob and rock it, and in the
; lee of a building or wall a weaker wind that churns. Needs the wind above
; on: with no wind there is nothing to gust.
gusts=false

; How gusty: 1 = a gusty day near buildings (gusts of about a fifth of the
; wind's speed along and across it, an eighth up and down; behind a
; building, a third), 2 = twice that, 0.5 = half.
turbulence=1.0
