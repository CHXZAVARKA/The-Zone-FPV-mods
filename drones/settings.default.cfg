; drones 1.2 - settings.
; Change a value, save, restart the game - or change it in Pause > Mods with
; mod_settings. Delete a line to use the default. Updates keep what you
; change here (settings.default.cfg has the defaults). drones/status.txt
; shows what was added and each drone's figures.

; Rates per drone. The game has one set of rates for every drone; with this
; on, each drone keeps its own. Change the rates (the game's Rates page)
; while a drone is picked and they are kept for that drone; pick another and
; its own come back. A drone picked for the first time starts with the rates
; you had. The game's drones and the ones you add each count. They are kept
; in drones/rates.cfg (delete it to start again).

[rates]

; true = each drone keeps its own rates; false = one set for all, as the game
; has it.
per_drone=false

;; ---- Drones ----
; Every drone's props, frame and motors, in one place: rotor_drag, dirty_air,
; motor_response and flight_controller all read them from here.

; Drones you add are set up in my_drones.cfg (see README.txt) and are in the
; list here too, with all their settings. A BETAFPV Meteor75 Pro II comes in
; it commented out: take the "; " off its lines and restart to add it. An
; added drone takes these figures from the drone it is built on for anything
; its block leaves out.

; 65mm Whoop - 0702 motors, 31 mm props in ducts.
[65mm_freestyle]

; Prop diameter, mm.
prop_mm=31

; true = the props are in ducts (a whoop or cinewhoop).
ducted=true

; Motor to motor, diagonally across the frame, mm.
wheelbase_mm=65

; The motors' time constant: ms to close 63% of a throttle change (95%
; takes three times as long). Measured: 39 ms for a 5.1" prop on a 2306
; motor, about 26-40 ms for 3" to 5" racers; the whoops' are estimates from
; their lighter props.
motor_ms=25

; For dirty_air, this drone's own prop wash: how much each prop's thrust
; comes and goes in dirty air (its own wake, and the air it left behind),
; times dirty_air's wash. 1 = as measured on small props; raise it for more
; prop wash on this drone.
wash=1.0

; For dirty_air, how strong the air this drone leaves behind is when it
; flies back into it, times dirty_air's wake. 1 = as worked out from its
; weight and props.
wake=1.0

; 75mm Whoop - 40 mm props in ducts, as the 85mm has, on a shorter frame.
[75mm_freestyle]
prop_mm=40
ducted=true
wheelbase_mm=75
motor_ms=30
wash=1.0
wake=1.0

; 85mm Whoop - 1102 motors, 40 mm props in ducts.
[85mm_freestyle]
prop_mm=40
ducted=true
wheelbase_mm=85
motor_ms=30
wash=1.0
wake=1.0

; 2.5" Freestyle - 2.5" props, open.
[2.5in_freestyle]
prop_mm=64
ducted=false
wheelbase_mm=115
motor_ms=28
wash=1.0
wake=1.0

; 3.5" Freestyle - 3.5" props, open (motors between the measured 3" and 5").
[3.5in_freestyle]
prop_mm=89
ducted=false
wheelbase_mm=150
motor_ms=32
wash=1.0
wake=1.0

; 5" Freestyle - 5" props, open; motors measured on a 5.1" prop and 2306.
[5in_freestyle]
prop_mm=127
ducted=false
wheelbase_mm=225
motor_ms=40
wash=1.0
wake=1.0

; Beginner 5" - 5" props, open; lower-kv motors.
[beginner_5_in_quad]
prop_mm=127
ducted=false
wheelbase_mm=225
motor_ms=45
wash=1.0
wake=1.0

; 5" Racer - 5" props, open, a tighter frame.
[5in_racer]
prop_mm=127
ducted=false
wheelbase_mm=215
motor_ms=40
wash=1.0
wake=1.0

; Any other quad.
[other]
prop_mm=40
ducted=true
wheelbase_mm=75
motor_ms=30
wash=1.0
wake=1.0
